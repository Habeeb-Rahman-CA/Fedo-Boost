[package]
name = "fedo-boost"
version = "1.0.0"
edition = "2021"
authors = ["Fedora Boost Team <habrmnc@fedora.local>"]
description = "Fedo Boost - High-performance Linux system monitoring, telemetry and automated diagnostic TUI"
license = "MIT"
repository = "https://github.com/Habeeb-Rahman-CA/Fedo-Boost"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
