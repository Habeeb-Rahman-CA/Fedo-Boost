[package]
name = "fedora-boost"
version = "0.1.0"
edition = "2021"
authors = ["Fedora Boost Team"]
description = "A minimal, lightning-fast Fedora system performance assistant TUI"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
libc = "0.2"
